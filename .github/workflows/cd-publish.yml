name: cd-publish

# Publishes the image to GHCR for a given tag, then deploys it to dev. Invoked by cd-tag after a version
# bump, or manually to (re)publish an existing tag after a failed build without
# minting a new version.
#
# Two tags are pushed, both immutable: vX.Y.Z and the short commit SHA. Neither
# is ever moved — Container Apps only creates a revision when the template
# changes, so re-pushing a moving tag would deploy nothing and report success.
on:
  workflow_call:
    inputs:
      version:
        description: Git tag to publish (e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing git tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # `ref` is the tag, so tag-with-sha records the commit actually built.
  publish:
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy findings to code scanning
    uses: jay-withers/workflows/.github/workflows/docker.yml@3386ab72905272859ed467e979cfdb5ce8b078ca # v1.13.0
    with:
      images: |
        [{"name": "sectest", "context": "."}]
      ref: ${{ inputs.version }}
      push: true
      tags: ${{ inputs.version }}
      tag-with-sha: true
      summary-note: The `deploy` job rolls this onto dev. To redeploy, re-run this workflow with the tag.

  # Rolls the tag just published onto dev with this repo's own `make deploy`,
  # through the shared container-apps-deploy.yml: OIDC in the `dev` GitHub
  # environment, then `make deploy IMAGE_TAG=<version>` from a checkout of the
  # tag. It runs on a manual re-publish too, so workflow_dispatch is also how
  # to redeploy an existing tag.
  #
  # id-token: write must also be granted by cd-tag's publish job, which calls
  # this workflow: a called workflow never holds more than its caller.
  deploy:
    needs: publish
    permissions:
      id-token: write
      contents: read
      issues: write # the deploy-failed issue
    uses: jay-withers/workflows/.github/workflows/container-apps-deploy.yml@3386ab72905272859ed467e979cfdb5ce8b078ca # v1.13.0
    with:
      version: ${{ inputs.version }}

name: ci-python

# Runs the test suite, mypy, ruff and both coverage floors on a pull request, via
# the shared workflow so every repo of ours gets the same job and a fix lands
# once.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # `extras: dev`: pytest sits in [project.optional-dependencies], and `uv run`
    # installs dependency groups but not extras.
    #
    # The interpreter is mise.toml's python (python.yml reads it from mise;
    # python-version only applies without mise), and ci-container-build
    # checks it is the image's, so a pass here is a pass on the interpreter
    # that ships.
    #
    # Deliberately not path filtered: a required check skipped by a path filter
    # never reports, which blocks a pull request rather than passing it.
    uses: jay-withers/workflows/.github/workflows/python.yml@93bff29fb7e15a3669a1f120ab0c3a2940a413d6 # v1.34.0
    with:
      working-directory: .
      extras: dev
      coverage: sectest
      # Both floors fail the check: the total (coverage-min), so the package
      # can't slip, and the lines a PR changes (diff-coverage), so new code
      # comes with its tests. A test that only asserts a mock still counts,
      # so review the tests too. The table is in the job summary; there is
      # no PR comment.
      coverage-min: "90"
      diff-coverage: "90"
      typecheck: mypy
      # ruff check and ruff format --check, from the locked dev extra, so CI
      # runs the ruff `make lint` does.
      lint: true

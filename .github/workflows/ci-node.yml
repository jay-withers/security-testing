name: ci-node

# The scanner's suite (src/*.ts, tests/*.test.ts): tests, tsc, ESLint,
# Prettier and both coverage floors, via the shared node.yml, on the Node
# mise.toml pins. The job is `test`, so it reports as `test / Test`, the
# required check github-repos names, which ci-python reported before the
# TypeScript replaced the Python.
#
# Deliberately not path filtered: a suite that runs on
# every pull request is the one that is known to pass.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: jay-withers/workflows/.github/workflows/node.yml@5d343e509d10133cf6358b2da80df75f2a2c073a # v1.36.0
    with:
      coverage: true
      # Both floors fail the check: the total, so the scanner can't slip, and
      # the lines a PR changes, so new code comes with its tests.
      coverage-min: "90"
      diff-coverage: "90"

name: ci-terraform

# Terraform CI. The shared workflow runs credential-free init and validate.
# Plans are intentionally left to an operator with access to the applied shared
# Container Apps environment; this repository resolves that environment through
# a data source and cannot produce a useful credential-free plan.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # pull-requests: read is what the shared workflow's own path filter needs.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@fb1c41960759020f9425e1351bf3cd893143d657 # v1.4.14

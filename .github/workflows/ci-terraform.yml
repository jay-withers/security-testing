name: ci-terraform

# Terraform CI. `validate` comes from the shared terraform.yml; `plan` from the
# shared terraform-deploy.yml, which comments the plan on the PR.
#
# This configuration resolves the shared Container Apps environment with a
# `data` source, so a useful plan needs real Azure credentials against the
# applied platform. Only `dev` is planned: it is the only environment the
# platform has, and the only one with an Azure identity.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # pull-requests: read is what the shared workflow's own path filter needs.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@74e8ea455cea667b8c6bcf0de23d8f37eeb31fec # v1.10.0

  # Plans dev against Azure using GitHub OIDC, through the shared
  # terraform-deploy.yml, which also posts the plan as a PR comment (edited in
  # place on every push). cd-terraform calls the same workflow with
  # apply: true, so the PR runs the same init and plan the merge will.
  #
  # The shared job runs in the `dev` GitHub environment. That is where
  # github-repos sets AZURE_CLIENT_ID, AZURE_TENANT_ID and
  # AZURE_SUBSCRIPTION_ID, and it makes the OIDC subject
  # `<repo prefix>:environment:dev`, which the identity's federated credential
  # trusts. Those variables are invisible to this calling job, so nothing here
  # can gate on them; the shared workflow fails early, naming the variable, if
  # one is missing.
  #
  # The `changed` output reuses the shared workflow's path filter rather than
  # declaring a second dorny/paths-filter here that would drift from it. The
  # cost is ordering: `needs` waits for the whole called workflow, so this
  # starts after validate rather than beside it. Deliberately not always(): if
  # validate failed, init would fail here for the same reason and the plan
  # would buy no information the required check has not already reported.
  plan:
    needs: terraform
    if: needs.terraform.outputs.changed == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write # the plan comment
    uses: jay-withers/workflows/.github/workflows/terraform-deploy.yml@74e8ea455cea667b8c6bcf0de23d8f37eeb31fec # v1.10.0
    with:
      environment: dev

  # Required status check for the plan job. The shared workflow's own gate
  # ("terraform / Terraform") covers only what runs inside it, so plan needs an
  # always-reporting job of its own or a failed plan could not block a merge.
  #
  # Skipped counts as success: a pull request touching no Terraform must pass
  # rather than hang. Mark
  # this check ("terraform-plan") required in the ruleset alongside
  # "terraform / Terraform".
  terraform-plan:
    needs: plan
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the plan job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          echo "plan=$PLAN_RESULT"
          if [ "$PLAN_RESULT" = "failure" ]; then
            echo "::error::The Terraform plan failed."
            exit 1
          fi

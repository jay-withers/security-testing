name: cd-terraform

# Applies dev on every merge to main that touches Terraform, through the
# shared terraform-deploy.yml: plan, then apply that exact plan in the same
# job, skipped when nothing changed. This replaces a local `make apply ENV=dev`.
#
# Only dev, because the platform has no other environment.
#
# Auth is the OIDC identity github-repos creates for this repo. The shared
# job runs in the `dev` GitHub environment, which holds AZURE_CLIENT_ID,
# AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID and makes the token subject
# `<repo prefix>:environment:dev` — the subject the identity's one federated
# credential trusts, for ci-terraform's plans and this apply alike. The
# identity holds Contributor on rg-sectest-dev and Reader on the
# subscription, nothing more. Contributor cannot write role assignments, so a
# change that adds or replaces one fails here with AuthorizationFailed; apply
# that change locally with `make apply ENV=dev`, then re-run this workflow.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".terraform-version"
      - ".github/workflows/cd-terraform.yml"
  # Re-apply without a commit: after a failed run, or to correct drift.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    permissions:
      id-token: write
      contents: read
      issues: write # the deploy-failed issue
    uses: jay-withers/workflows/.github/workflows/terraform-deploy.yml@74e8ea455cea667b8c6bcf0de23d8f37eeb31fec # v1.10.0
    with:
      environment: dev
      apply: true

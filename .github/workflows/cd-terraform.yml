name: cd-terraform

# Plans dev on every merge to main that touches Terraform, through the shared
# terraform-deploy.yml, and applies only when run by hand (Actions -> Run
# workflow). A merge whose plan has changes opens a `terraform-pending` issue
# instead; the manual run applies exactly the plan it prints and closes the
# issue. Infrastructure changes wait for a human; app deploys don't.
#
# Only dev, because the platform has no other environment.
#
# Auth is the OIDC identity github-repos creates for this repo. The shared
# job runs in the `dev` GitHub environment, which holds AZURE_CLIENT_ID,
# AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID and makes the token subject
# `<repo prefix>:environment:dev` — the subject the identity's one federated
# credential trusts, for ci-terraform's plans and this apply alike. The
# identity holds Contributor and Role Based Access Control Administrator on
# rg-sectest-dev (conditioned: it can't grant Owner, User Access Administrator or
# RBAC Administrator), Reader on the subscription and join on
# cae-platform-dev, nothing more. So role assignments inside rg-sectest-dev
# apply here. One anywhere else fails with AuthorizationFailed: apply that
# change locally with `make apply ENV=dev`, then re-run this workflow.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".terraform-version"
      - ".github/workflows/cd-terraform.yml"
  # The manual apply: also re-runs a failed apply, or corrects drift.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    permissions:
      id-token: write
      contents: read
      issues: write # the deploy-failed issue
    uses: jay-withers/workflows/.github/workflows/terraform-deploy.yml@e58b7edf840e0d24387064427d7c7e81338c6d40 # v1.20.0
    with:
      environment: dev
      apply: ${{ github.event_name == 'workflow_dispatch' }}

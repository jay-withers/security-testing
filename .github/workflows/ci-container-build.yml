name: ci-container-build

# Builds the image on a pull request, without pushing. The mechanics live in
# jay-withers/workflows' docker.yml, which cd-publish also calls, so the only
# difference between a PR build and a release build is `push`.
on:
  pull_request:
    branches: [main]
  # Daily on main as well, so a fix published upstream for something in the
  # image (a CVE the Trivy gate fails on) is heard about the day it lands,
  # through a build-failed issue, rather than as every Renovate PR failing
  # container-build for a reason unrelated to it. Run it by hand to re-check
  # once fixed; the next green build closes the issue.
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The path filter lives here rather than on the trigger, so the workflow runs
  # on every pull request and the container-build gate below always reports.
  # A trigger-level filter would mean a docs-only pull request never produced
  # the check, and a required check that never reports leaves the pull request
  # pending for ever.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            image:
              - 'src/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci-container-build.yml'

  # Not itself the required check: container-build below is, because it
  # reports even when this job is skipped.
  build:
    needs: changes
    # Outside a pull request `changes` is skipped, and a skipped need would
    # skip this too without !cancelled().
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || needs.changes.outputs.image == 'true')
    permissions:
      contents: read
      security-events: write # Trivy findings to code scanning
      issues: write # build-failed issue, outside pull requests
    uses: jay-withers/workflows/.github/workflows/docker.yml@1961dfbd65114641c5fcfd4677a7ca3f0668e513 # v1.26.1
    with:
      images: |
        [{"name": "sectest", "context": "."}]
      failure-issue: ${{ github.event_name != 'pull_request' }}

  # The required status check ("container-build"). Skipped counts as success,
  # so a pull request that touches nothing in the image passes; a failed or
  # cancelled build fails it. Without this, Renovate's platform auto-merge did
  # not wait for the build, and a Python 3.15 base image that could not build
  # merged in three repos.
  container-build:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the build job
        env:
          EVENT: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES_RESULT build=$BUILD_RESULT"
          # A failed path filter skips the build, which must not read as a pass.
          # Only a pull request runs the filter; elsewhere it is skipped.
          if [ "$EVENT" = "pull_request" ] && [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::The path filter did not run, so the build was never decided."
            exit 1
          fi
          if [ "$BUILD_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "cancelled" ]; then
            echo "::error::The container build failed."
            exit 1
          fi

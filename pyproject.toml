[project]
name = "sectest"
version = "0.1.0"
description = "Scheduled OWASP ZAP scanner for every externally reachable app on the shared Container Apps platform"
# 3.11 because the runtime is the ZAP image's own Debian bookworm python3 — see
# the Dockerfile. Raise it only when ZAP moves to a newer base.
requires-python = ">=3.11"

dependencies = [
  "azure-identity>=1.26",
  "azure-mgmt-resourcegraph>=8.0",
  "azure-storage-blob>=12.31",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.8"]

# What the Dockerfile's ENTRYPOINT resolves to. Terraform sets no `command`, so
# this name lives in exactly one place.
[project.scripts]
sectest = "sectest.scan:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sectest"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# S: bandit's security rules, so a risky pattern fails the commit locally
# rather than waiting for CodeQL on the pull request.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S"]

# Test code is exempt from the bandit rules that only make sense in shipped
# code: pytest is built on `assert` (S101), fixtures use dummy tokens (S105,
# S106) and loopback binds (S104), and a test may shell out on purpose (S603,
# S607). Everything else under "S" still applies to tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Warnings are errors, so a deprecation in a dependency is seen on the bump
  # that introduced it rather than on the release that removes the feature.
  "error",
]

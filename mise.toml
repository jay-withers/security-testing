# Tool versions for this repo. Locally: run jay-withers/toolchain's setup.sh
# once per machine, then `mise install` here. CI installs the same versions
# (jay-withers/workflows v1.26.1+), and Renovate keeps them current.

[tools]
# Runs pre-commit and its Python hooks only: the scanner is TypeScript, and
# the ZAP wrappers use the image's own python3, which nothing here tests on.
# Renovate raises patches only (jay-withers/renovate's mise preset).
python = "3.11.18"
# The scanner's runtime, which local runs and ci-node test on. The image's
# node comes from dev-containers' node-app, which should carry the same
# release (ci-container-build checks the majors match). Renovate never raises
# this major (jay-withers/renovate's npm preset): it moves by hand, with
# node-app's and @types/node, once a new major is LTS.
node = "26.13.1"
pre-commit = "4.7.0"
# actionlint lints workflow run: blocks with it, and silently skips them without it.
shellcheck = "0.11.0"
terraform = "1.17.2"
tflint = "0.66.0"
terraform-docs = "0.25.1"
checkov = "3.4.5"

# Tool versions for this repo. Locally: run jay-withers/toolchain's setup.sh
# once per machine, then `mise install` here. CI installs the same versions
# (jay-withers/workflows v1.26.1+), and Renovate keeps them current.

[tools]
# The ZAP image's interpreter (bookworm's python3, 3.11), so local runs and
# CI test what the job runs; ci-container-build checks the two match.
# Renovate raises patches only (jay-withers/renovate's mise preset). Also runs
# pre-commit and its Python hooks.
python = "3.11.18"
uv = "0.13.9"
pre-commit = "4.7.0"
# actionlint lints workflow run: blocks with it, and silently skips them without it.
shellcheck = "0.11.0"
terraform = "1.17.2"
tflint = "0.66.0"
terraform-docs = "0.25.1"
checkov = "3.4.5"
